[project]
name = "easy-bigquery"
version = "0.1.1-alpha"
description = "Easy BigQuery is a Python package designed to simplify interactions with Google BigQuery. It provides a high-level API for connecting, fetching, and pushing data, allowing you to focus on your data analysis instead of boilerplate code."
license = "MIT"
authors = [
    {name = "AndreAmorim05",email = "js.andreamorim@gmail.com"}
]
readme = "README.md"
classifier = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "python-decouple (>=3.8,<4.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "google-cloud-bigquery (>=3.31.0,<4.0.0)",
    "db-dtypes (>=1.4.2,<2.0.0)",
    "google-cloud-bigquery-storage (>=2.31.0,<3.0.0)",
    "pandas-gbq (>=0.29.0,<0.30.0)",
    "loguru (>=0.7.3,<0.8.0)",
]

[project.scripts]
easy-bigquery = "easy_bigquery.cli:main"

[tool.poetry.urls]
"Home Page" = "https://easy-bigquery.readthedocs.io/en/latest/"
"Documentation" = "https://easy-bigquery.readthedocs.io/en/latest/"
"Source Code" = "https://github.com/AndreAmorim05/easy-bigquery"
"Bug Tracker" = "https://github.com/AndreAmorim05/easy-bigquery/issues"
"Changelog" = "https://github.com/AndreAmorim05/easy-bigquery/blob/main/CHANGELOG.md"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
blue = "^0.9.1"
isort = "^6.0.1"
taskipy = "^1.14.1"
pytest-mock = "^3.14.1"
flake8 = "^7.0.0"
mypy = "^1.8.0"
bandit = "^1.7.5"
pre-commit = "^3.6.0"


[tool.poetry.group.doc.dependencies]
mkdocs-material = "^9.6.14"
mkdocstrings = "^0.29.1"
mkdocstrings-python = "^1.16.12"
mkdocs-macros-plugin = "^1.3.7"
jinja2 = "^3.1.6"
pymdown-extensions = "^10.16"

[tools.pytest.ini_options]
pythonpath = "."
addopts = "--doctest-modules"

[tool.isort]
profile = "black"
line_length = 79

[tool.taskipy.tasks]
lint = "blue --check --diff . && isort --check --diff ."
lint-full = "blue --check --diff . && isort --check --diff . && flake8 easy_bigquery/ tests/"
security = "bandit -r easy_bigquery/ -f txt"
type-check = "mypy easy_bigquery/ --ignore-missing-imports"
docs = "mkdocs serve"
pre_test = "task lint-full"
test = "pytest -s -x --cov=easy_bigquery -vv"
test-integration = "pytest tests/integration/ -m integration -v"
post_test = "coverage html"
install-hooks = "pre-commit install"
